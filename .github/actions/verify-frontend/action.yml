name: Verify frontend
description: >-
  Provisions Node 20 (corepack/Yarn 4) and runs the full frontend gate —
  immutable install, ESLint, `tsc -b && vite build`, and Vitest with the 80%
  coverage threshold. Fails the calling step on any ESLint error, type error,
  test failure, or coverage breach.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node
    - name: yarn install
      shell: bash
      working-directory: frontend
      run: yarn install --immutable
    - name: yarn lint
      shell: bash
      working-directory: frontend
      run: yarn lint
    - name: yarn build (typecheck + bundle)
      shell: bash
      working-directory: frontend
      # Empty on purpose: the release workflow ships this same dist/ inside the JAR,
      # where Spring Boot serves the SPA and the API from one origin. An empty base
      # URL keeps every request relative, so the image works under any hostname.
      env:
        VITE_BACKEND_BASE_URL: ""
      run: yarn build
    - name: yarn test:coverage
      shell: bash
      working-directory: frontend
      run: yarn test:coverage
